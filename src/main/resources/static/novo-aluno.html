<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Novo Aluno</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="container" style="max-width: 600px; margin-top: 2rem;">
    <div class="card">
      <div class="card-header">
        <h2>Novo Aluno, Anamnese e Mensalidade</h2>
        <a href="index.html" class="btn-secondary">Voltar</a>
      </div>

      <form id="form-cadastro" style="padding: 1.5rem;">
        
        <h3>Dados Pessoais</h3>
        <div style="margin-bottom: 1rem;">
          <label>Nome:</label><br>
          <input type="text" id="nome" required style="width: 100%; padding: 8px;">
        </div>
        <div style="margin-bottom: 1rem;">
          <label>Telefone / Celular:</label><br>
          <input type="text" id="telefone" style="width: 100%; padding: 8px;">
        </div>
        <div style="margin-bottom: 1rem;">
          <label>E-mail:</label><br>
          <input type="email" id="email" style="width: 100%; padding: 8px;">
        </div>
        <div style="margin-bottom: 1rem;">
          <label>Data de Nascimento:</label><br>
          <input type="date" id="dataNascimento" style="width: 100%; padding: 8px;">
        </div>

        <hr style="margin: 1.5rem 0;">

        <h3>Anamnese</h3>
        <div style="margin-bottom: 1rem;">
          <label>Histórico Médico:</label><br>
          <textarea id="historicoMedico" style="width: 100%; padding: 8px;"></textarea>
        </div>
        <div style="margin-bottom: 1rem;">
          <label>Objetivos:</label><br>
          <textarea id="objetivos" style="width: 100%; padding: 8px;"></textarea>
        </div>
        <div style="margin-bottom: 1rem;">
          <label>Restrições:</label><br>
          <textarea id="restricoes" style="width: 100%; padding: 8px;"></textarea>
        </div>

        <hr style="margin: 1.5rem 0;">

        <h3>Primeira Mensalidade (Parcela Inicial)</h3>
        <div style="margin-bottom: 1rem;">
          <label>Valor (R$):</label><br>
          <input type="number" step="0.01" id="valorMensalidade" value="100.00" style="width: 100%; padding: 8px;">
        </div>
        <div style="margin-bottom: 1rem;">
          <label>Data de Vencimento:</label><br>
          <input type="date" id="dataVencimento" style="width: 100%; padding: 8px;">
        </div>

        <button type="submit" id="btn-salvar" class="btn-primary" style="width: 100%; padding: 10px; cursor: pointer;">Salvar Cadastro Completo</button>
      </form>
    </div>
  </main>

  <script>
      document.getElementById('form-cadastro').addEventListener('submit', function(e) {
        e.preventDefault();

        var botao = document.getElementById('btn-salvar');
        botao.disabled = true;
        botao.textContent = 'Salvando...';

        var dadosAluno = {
          nome: document.getElementById('nome').value,
          telefone: document.getElementById('telefone').value,
          email: document.getElementById('email').value,
          dataNascimento: document.getElementById('dataNascimento').value || null,
          
          anamnese: {
            historicoMedico: document.getElementById('historicoMedico').value,
            objetivos: document.getElementById('objetivos').value,
            restricoes: document.getElementById('restricoes').value
          },

          mensalidades: [
            {
              valor: parseFloat(document.getElementById('valorMensalidade').value) || 0,
              dataVencimento: document.getElementById('dataVencimento').value || null,
              status: 'PENDENTE'
            }
          ]
        };

        // Envia para o backend
        fetch('http://localhost:8081/alunos', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(dadosAluno)
        })
        .then(function(resposta) {
          if (!resposta.ok) {
            throw new Error('Erro ao salvar no servidor (Status: ' + resposta.status + ')');
          }
          alert('Aluno, anamnese e mensalidade cadastrados com sucesso!');
          window.location.href = 'index.html';
        })
        .catch(function(erro) {
          console.error('Erro capturado:', erro);
          alert('Erro ao cadastrar. Verifique o console.');
          botao.disabled = false;
          botao.textContent = 'Salvar Cadastro Completo';
        });
      });
  </script>
  
</body>
</html>
