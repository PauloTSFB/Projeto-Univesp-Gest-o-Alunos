<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Atendimento - Gestão de Alunos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Barra de Navegação -->
    <header class="navbar">
        <div class="brand">
            <h1>Sistema de Gestão</h1>
        </div>
        <nav class="nav-links">
            <a href="index.html">Dashboard</a>
        </nav>
    </header>

    <main class="container" style="max-width: 600px; margin-top: 2rem;">
        <section class="card">
            <div class="card-header">
                <h2>Registar Novo Atendimento</h2>
            </div>
            
            <form id="formAtendimento" style="margin-top: 1.5rem;">
                
                <div style="margin-bottom: 1.2rem;">
                    <label for="alunoId" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Selecionar Aluno:</label>
                    <select id="alunoId" name="alunoId" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                        <option value="">A carregar alunos...</option>
                    </select>
                </div>

                <div style="margin-bottom: 1.2rem;">
                    <label for="dataHora" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Data e Horário:</label>
                    <input type="datetime-local" id="dataHora" name="dataHora" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label for="observacao" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Descrição / Observações:</label>
                    <input type="text" id="observacao" name="observacao" placeholder="Ex: Atendimento de rotina / Treino" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn-secondary" style="background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; flex: 1;">Salvar Agendamento</button>
                    <a href="index.html" class="btn-secondary" style="background-color: #6c757d; color: white; padding: 10px 20px; text-align: center; text-decoration: none; border-radius: 4px; display: inline-block; flex: 1;">Cancelar</a>
                </div>

            </form>
        </section>
    </main>

    <script>
        // Carrega os alunos reais cadastrados na base de dados
        fetch('http://localhost:8081/alunos')
            .then(function(resposta) {
                return resposta.json();
            })
            .then(function(alunos) {
                const select = document.getElementById('alunoId');
                select.innerHTML = '<option value="">Selecione um aluno</option>';
                
                if (alunos.length === 0) {
                    select.innerHTML = '<option value="">Nenhum aluno cadastrado</option>';
                    return;
                }

                alunos.forEach(function(aluno) {
                    let option = document.createElement('option');
                    option.value = aluno.id;
                    option.textContent = aluno.nome + (aluno.telefone ? ' (' + aluno.telefone + ')' : '');
                    select.appendChild(option);
                });
            })
            .catch(function(erro) {
                console.error('Erro ao carregar alunos:', erro);
                document.getElementById('alunoId').innerHTML = '<option value="">Erro ao carregar alunos</option>';
            });

        // Envia o novo agendamento para o backend
        document.getElementById('formAtendimento').addEventListener('submit', function(e) {
            e.preventDefault();

            const atendimentoData = {
                dataHora: document.getElementById('dataHora').value,
                observacao: document.getElementById('observacao').value,
                aluno: {
                    id: document.getElementById('alunoId').value
                }
            };

            fetch('http://localhost:8081/api/atendimentos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(atendimentoData)
            })
            .then(function(resposta) {
                if (resposta.ok) {
                    alert('Agendamento registado com sucesso!');
                    window.location.href = 'index.html';
                } else {
                    alert('Erro ao registar o atendimento.');
                }
            })
            .catch(function(erro) {
                console.error('Erro na requisição:', erro);
                alert('Erro de conexão com o servidor.');
            });
        });
    </script>

</body>
</html>
